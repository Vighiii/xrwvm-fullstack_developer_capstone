apiVersion: apps/v1
kind: Deployment
metadata:
  name: dealership-api
  labels:
    app: dealership
    component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: dealership
      component: api
  template:
    metadata:
      labels:
        app: dealership
        component: api
    spec:
      containers:
      - name: dealership-api
        image: dealership-api:latest
        imagePullPolicy: Never  # For local development
        ports:
        - containerPort: 3030
        envFrom:
        - configMapRef:
            name: dealership-config
        env:
        - name: MONGODB_URL
          valueFrom:
            configMapKeyRef:
              name: dealership-config
              key: MONGODB_URL
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /health
            port: 3030
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3030
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: dealership-api-service
  labels:
    app: dealership
    component: api
spec:
  selector:
    app: dealership
    component: api
  ports:
  - port: 3030
    targetPort: 3030
  type: LoadBalancer
